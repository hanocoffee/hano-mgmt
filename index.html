<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="hano mgmt" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #f5f0e8;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* Header */
    .header {
      background: #1a1a18;
      color: #f5f0e8;
      padding: 22px 20px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-sub { font-size: 10px; opacity: 0.4; letter-spacing: 0.3em; margin-bottom: 4px; }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; }
    .header-date { font-size: 11px; opacity: 0.35; margin-top: 4px; font-family: 'Noto Sans JP', sans-serif; }

    /* Tabs */
    .tabs {
      display: flex;
      background: #1a1a18;
      border-top: 1px solid #333;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px 8px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }
    .tab-btn.active { border-bottom-color: #c8a86b; }
    .tab-icon { font-size: 16px; }
    .tab-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #666;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .tab-btn.active .tab-label { color: #c8a86b; }

    /* Progress */
    .progress-wrap { padding: 14px 20px 0; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .progress-meta .done { color: #5a8a5a; font-weight: 700; }
    .progress-bar-bg { height: 3px; background: #e0d8cc; border-radius: 2px; }
    .progress-bar { height: 100%; border-radius: 2px; transition: width 0.35s ease; background: #c8a86b; }
    .progress-bar.complete { background: #5a8a5a; }

    /* Content */
    .content { flex: 1; padding: 20px 16px 80px; overflow-y: auto; }

    /* Section */
    .section { margin-bottom: 28px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-bar { width: 3px; height: 16px; border-radius: 2px; flex-shrink: 0; }
    .section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #3a3a38; }
    .section-count { font-size: 11px; margin-left: auto; letter-spacing: 0.05em; font-family: 'Noto Sans JP', sans-serif; }
    .items { display: flex; flex-direction: column; gap: 8px; }

    /* Item */
    .item-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fff;
      border: 1.5px solid #ece6dc;
      border-radius: 6px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all 0.18s ease;
    }
    .item-btn.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid #c8bfb0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 0.18s ease;
    }
    .item-btn.checked .checkbox {
      border-color: var(--accent);
      background: var(--accent);
    }
    .check-svg { display: none; }
    .item-btn.checked .check-svg { display: block; }
    .item-text {
      font-size: 14px;
      color: #2a2a28;
      line-height: 1.5;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 0.02em;
      transition: all 0.18s ease;
    }
    .item-btn.checked .item-text {
      color: #aaa;
      text-decoration: line-through;
      text-decoration-color: #bbb;
    }

    /* SNS運用 */
    .subnav { display: flex; gap: 6px; padding: 14px 16px 0; }
    .subnav-btn {
      flex: 1;
      padding: 9px 0;
      font-size: 11px;
      letter-spacing: 0.06em;
      font-family: 'Noto Sans JP', sans-serif;
      background: #fff;
      border: 1.5px solid #ece6dc;
      border-radius: 6px;
      color: #8a8478;
      cursor: pointer;
      transition: all 0.15s;
    }
    .subnav-btn.active { background: #1a1a18; color: #e8dcc0; border-color: #1a1a18; }
    .subnav-count { opacity: 0.55; font-size: 10px; }
    .card {
      background: #fff;
      border: 1.5px solid #ece6dc;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: #2a2a28; font-family: 'Noto Sans JP', sans-serif; line-height: 1.5; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 9px;
      border-radius: 10px;
      background: #f0e9dd;
      color: #8a7a5a;
      font-family: 'Noto Sans JP', sans-serif;
      margin-bottom: 6px;
    }
    .card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .sbtn {
      padding: 8px 12px;
      font-size: 11px;
      border-radius: 4px;
      border: 1.5px solid #d0c8bc;
      background: none;
      color: #6a655c;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 0.05em;
    }
    .sbtn.primary { background: #1a1a18; color: #e8dcc0; border-color: #1a1a18; }
    .sbtn.danger { color: #a86b6b; border-color: #ddc8c8; }
    .field-row { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type=text], input[type=number], input[type=date], select, textarea {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
      border: 1.5px solid #d8d0c4;
      border-radius: 4px;
      padding: 9px 10px;
      background: #fdfbf7;
      color: #2a2a28;
      width: 100%;
    }
    textarea { min-height: 130px; line-height: 1.7; resize: vertical; margin-top: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      font-size: 11px;
      padding: 6px 11px;
      border-radius: 14px;
      border: 1px solid #d8cbb2;
      background: #faf6ee;
      color: #8a7a5a;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .view-title { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #3a3a38; margin-bottom: 10px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: #1a1a18; border-radius: 6px; padding: 12px 6px; text-align: center; }
    .stat-num { font-size: 20px; color: #e8dcc0; font-weight: 700; }
    .stat-label { font-size: 10px; color: #888; margin-top: 3px; font-family: 'Noto Sans JP', sans-serif; }
    .best-card { font-size: 12px; font-family: 'Noto Sans JP', sans-serif; color: #8a7a5a; line-height: 1.6; }
    .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .metric-label { font-size: 10px; color: #999; font-family: 'Noto Sans JP', sans-serif; margin-bottom: 3px; display: block; }
    .empty-note { text-align: center; color: #b0a894; font-size: 12px; padding: 34px 0; font-family: 'Noto Sans JP', sans-serif; line-height: 1.9; }

    /* 期限チェック表 */
    .exp-row {
      background: #fff;
      border: 1.5px solid #ece6dc;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 8px;

    .exp-row.over { border-color: #c88a8a; background: #fdf5f3; }
    .exp-main { display: flex; align-items: center; gap: 8px; }
    .exp-name { font-size: 14px; font-weight: 700; color: #2a2a28; font-family: 'Noto Sans JP', sans-serif; flex: 1; line-height: 1.5; }
    .exp-badge {
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 10px;
      font-family: 'Noto Sans JP', sans-serif;
      flex-shrink: 0;
      background: #eef1ea;
      color: #5a8a5a;
      white-space: nowrap;

    .exp-badge.over { background: #f3dede; color: #a85a5a; }
    .exp-actions { display: flex; gap: 6px; margin-top: 9px; align-items: center; }

    .exp-actions .sbtn { flex-shrink: 0; }

    .reset-btn {
      background: none;
      border: 1.5px solid #d0c8bc;
      color: #aaa;
      padding: 9px 28px;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.2em;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>

// ── State ──────────────────────────────────────────
const DONE_KEY = "hano_done_v1";
let activeTab = "ops";
let done = {};

// チェック状態の保存・復元（営業タブは日付が変わると自動で新しい日になる。他タブはリセットまで保持）
function loadDone() {
  try {
    const raw = localStorage.getItem(DONE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || typeof d.done !== "object" || d.done === null) return;
    done = d.done;
    if (d.opsDate !== todayStr()) {
      TAB_DATA.ops.flatMap(s => s.items).forEach(i => delete done[i.id]);
    }
  } catch (e) {}
}
function saveDone() {
  try { localStorage.setItem(DONE_KEY, JSON.stringify({ opsDate: todayStr(), done: done })); } catch (e) {}
}
loadDone();

function getAllItems(tabId) {
  return TAB_DATA[tabId].flatMap(s => s.items);
}

// ── 期限チェック表 ──────────────────────────────────
const EXP_KEY = "hano_exp_v1";
function loadExp() {
  try {
    const raw = localStorage.getItem(EXP_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.items)) return d;
    }
  } catch (e) {}
  return { items: [] };
}
let exp = loadExp();
function saveExp() {
  try { localStorage.setItem(EXP_KEY, JSON.stringify(exp)); } catch (e) {}
}

function addExp() {
  const nameEl = document.getElementById("exp-name");
  const dateEl = document.getElementById("exp-date");
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  if (!dateEl.value) { dateEl.focus(); return; }
  exp.items.push({ id: uid(), name: name, date: dateEl.value });
  saveExp();
  render();
}

function delExp(id) {
  const it = exp.items.find(x => x.id === id);
  if (!confirm((it ? "「" + it.name + "」" : "この行") + "を期限表から消しますか？")) return;
  exp.items = exp.items.filter(x => x.id !== id);
  saveExp();
  render();
}

function updateExpDate(id, value) {
  const it = exp.items.find(x => x.id === id);
  if (it && value) { it.date = value; saveExp(); render(); }
}

function expDays(dateStr) {
  return Math.round((new Date(dateStr) - new Date(todayStr())) / 86400000);
}
function expStatus(d) {
  if (d < 0) return { label: (-d) + "日超過", cls: "over" };
  if (d === 0) return { label: "今日まで", cls: "warn" };
  if (d <= 3) return { label: "あと" + d + "日", cls: "warn" };
  return { label: "あと" + d + "日", cls: "ok" };
}

function expHtml() {
  const items = exp.items.slice().sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
  return `
    <div class="card">
      <div class="view-title">期限を登録</div>
      <div class="field-row">
        <input type="text" id="exp-name" placeholder="品名（例: クリームチーズ 開封）" />
      </div>
      <div class="field-row" style="margin-bottom:0">
        <input type="date" id="exp-date" />
        <button class="sbtn primary" style="flex-shrink:0" onclick="addExp()">追加する</button>
      </div>
    </div>
    ${items.length ? items.map(it => {
      const st = expStatus(expDays(it.date));
      return `
      <div class="exp-row ${st.cls === "ok" ? "" : st.cls}">
        <div class="exp-main">
          <div class="exp-name">${esc(it.name)}</div>
          <span class="exp-badge ${st.cls === "ok" ? "" : st.cls}">${st.label}</span>
        </div>
        <div class="exp-actions">
          <input type="date" value="${esc(it.date)}" onchange="updateExpDate('${it.id}', this.value)" />
          <button class="sbtn danger" onclick="delExp('${it.id}')">使い切った・削除</button>
        </div>
      </div>`;
    }).join("") : `<div class="empty-note">まだ登録がありません。<br>開封した材料・仕込み・ケーキなどの期限を登録すると、<br>近い順に並んで色で警告されます。</div>`}
    ${items.length ? `<div class="reset-wrap"><button class="reset-btn" onclick="copyExp(this)">表をコピー</button></div>` : ""}
  `;
}

function copyExp(btn) {
  const items = exp.items.slice().sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
  const L = [];
  L.push("# hano coffee 期限チェック表（hano mgmt）");
  L.push("date: " + todayStr());
  L.push("期限:");
  items.forEach(it => {
    L.push("  - 品名: " + yamlq(it.name));
    L.push("    期限: " + it.date);
  });
  L.push("");
  copyText(L.join("\n"), btn);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function seedSns() {

function loadSns() {
  try {
    const raw = localStorage.getItem(SNS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.items)) return d;
    }
  } catch (e) {}
  return seedSns();
}
let sns = loadSns();
function saveSns() {
  try { localStorage.setItem(SNS_KEY, JSON.stringify(sns)); } catch (e) {}
}

function numOrNull(v) {
  const n = parseInt(v, 10);
  return isNaN(n) ? null : n;
}

// 画面上の入力値をデータに取り込む（再描画で消えないように）
function syncSnsInputs() {
  sns.items.forEach(it => {
    const cap = document.getElementById("cap-" + it.id);
    if (cap) it.caption = cap.value;
    const lk = document.getElementById("lk-" + it.id);
    if (lk) {
      it.metrics = {
        likes: numOrNull(lk.value),
        saves: numOrNull(document.getElementById("sv-" + it.id).value),
        reach: numOrNull(document.getElementById("rc-" + it.id).value),
      };
    }
    const dt = document.getElementById("dt-" + it.id);
    if (dt && dt.value) it.postedAt = dt.value;
  });
  const tp = document.getElementById("tag-preset");
  if (tp) sns.hashtags = tp.value;
}

function snsAutoSave() { syncSnsInputs(); saveSns(); }

function switchSnsView(v) {
  snsAutoSave();
  snsView = v;
  render();
}

function addIdea() {
  const input = document.getElementById("idea-title");
  const title = input.value.trim();
  if (!title) return;
  const cat = document.getElementById("idea-cat").value;
  sns.items.unshift({ id: uid(), title, cat, status: "idea", caption: "", createdAt: Date.now() });
  saveSns();
  render();
}

function useHint(i) {
  document.getElementById("idea-title").value = IDEA_HINTS[i];
}

function setStatus(id, status) {
  syncSnsInputs();
  const it = sns.items.find(x => x.id === id);
  if (!it) return;
  it.status = status;
  if (status === "posted" && !it.postedAt) it.postedAt = todayStr();
  saveSns();
  render();
}

function delItem(id) {
  if (!confirm("この投稿を削除しますか？")) return;
  syncSnsInputs();
  sns.items = sns.items.filter(x => x.id !== id);
  saveSns();
  render();
}

function addTags(id) {
  syncSnsInputs();
  const el = document.getElementById("cap-" + id);
  const tags = (sns.hashtags || "").trim();
  if (!tags || el.value.includes(tags)) return;
  el.value = el.value.replace(/\s+$/, "") + "\n\n" + tags;
  snsAutoSave();
}

function copyCaption(id, btn) {
  const el = document.getElementById("cap-" + id);
  const val = el.value;
  const feedback = () => {
    const t = btn.textContent;
    btn.textContent = "コピーしました ✓";
    setTimeout(() => { btn.textContent = t; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(feedback).catch(() => { el.select(); document.execCommand("copy"); feedback(); });
  } else {
    el.select();
    document.execCommand("copy");
    feedback();
  }
}

function saveSnsNow(btn) {
  snsAutoSave();
  const t = btn.textContent;
  btn.textContent = "保存しました ✓";
  setTimeout(() => { btn.textContent = t; }, 1400);
}

function saveAndRender() {
  snsAutoSave();
  render();
}

          <div><label class="metric-label">リーチ</label><input type="number" id="rc-${it.id}" min="0" value="${it.metrics && it.metrics.reach != null ? it.metrics.reach : ""}" onchange="snsAutoSave()" /></div>

function render() {

function switchTab(tabId) {
  if (activeTab === "sns") snsAutoSave();
  activeTab = tabId;
  render();
}

function toggleItem(id) {
  done[id] = !done[id];
  saveDone();
  render();
}

function resetTab() {
  if (!confirm("このタブのチェックをすべて外しますか？")) return;
  getAllItems(activeTab).forEach(i => delete done[i.id]);
  saveDone();
  render();
}

// ── 記録の書き出し ──────────────────────────────────
function yamlq(s) {
  return '"' + String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}

function buildRecordYaml(tabId) {
  const tab = TABS.find(t => t.id === tabId);
  const L = [];
  L.push("# hano coffee チェック記録（hano mgmt）");
  L.push("date: " + todayStr());
  L.push("タブ: " + yamlq(tab ? tab.label : tabId));
  TAB_DATA[tabId].forEach(section => {
    L.push("");
    L.push(yamlq(section.label) + ":");
    section.items.forEach(it => {
      L.push("  - 済: " + (done[it.id] ? "true" : "false"));
      L.push("    項目: " + yamlq(it.text));
    });
  });
  L.push("");
  return L.join("\n");
}

function copyText(text, btn) {
  const feedback = () => {
    const t = btn.textContent;
    btn.textContent = "コピーしました ✓";
    setTimeout(() => { btn.textContent = t; }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); feedback(); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(feedback, fallback);
  } else {
    fallback();
  }
}

function copyRecord(btn) {
  copyText(buildRecordYaml(activeTab), btn);
}

render();
</script>
</body>
