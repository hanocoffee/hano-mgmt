<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="hano mgmt" />
  <title>hano mgmt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #f5f0e8;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* Header */
    .header {
      background: #1a1a18;
      color: #f5f0e8;
      padding: 22px 20px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-sub { font-size: 10px; opacity: 0.4; letter-spacing: 0.3em; margin-bottom: 4px; }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.1em; }
    .header-date { font-size: 11px; opacity: 0.35; margin-top: 4px; font-family: 'Noto Sans JP', sans-serif; }

    /* Tabs */
    .tabs {
      display: flex;
      background: #1a1a18;
      border-top: 1px solid #333;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px 8px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
    }
    .tab-btn.active { border-bottom-color: #c8a86b; }
    .tab-icon { font-size: 16px; }
    .tab-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #666;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .tab-btn.active .tab-label { color: #c8a86b; }

    /* Progress */
    .progress-wrap { padding: 14px 20px 0; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .progress-meta .done { color: #5a8a5a; font-weight: 700; }
    .progress-bar-bg { height: 3px; background: #e0d8cc; border-radius: 2px; }
    .progress-bar { height: 100%; border-radius: 2px; transition: width 0.35s ease; background: #c8a86b; }
    .progress-bar.complete { background: #5a8a5a; }

    /* Content */
    .content { flex: 1; padding: 20px 16px 80px; overflow-y: auto; }

    /* Section */
    .section { margin-bottom: 28px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-bar { width: 3px; height: 16px; border-radius: 2px; flex-shrink: 0; }
    .section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #3a3a38; }
    .section-count { font-size: 11px; margin-left: auto; letter-spacing: 0.05em; font-family: 'Noto Sans JP', sans-serif; }
    .items { display: flex; flex-direction: column; gap: 8px; }

    /* Item */
    .item-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fff;
      border: 1.5px solid #ece6dc;
      border-radius: 6px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all 0.18s ease;
    }
    .item-btn.checked { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid #c8bfb0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 0.18s ease;
    }
    .item-btn.checked .checkbox {
      border-color: var(--accent);
      background: var(--accent);
    }
    .check-svg { display: none; }
    .item-btn.checked .check-svg { display: block; }
    .item-text {
      font-size: 14px;
      color: #2a2a28;
      line-height: 1.5;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 0.02em;
      transition: all 0.18s ease;
    }
    .item-btn.checked .item-text {
      color: #aaa;
      text-decoration: line-through;
      text-decoration-color: #bbb;
    }

    /* Reset */
    .reset-wrap { text-align: center; margin-top: 16px; }
    .reset-btn {
      background: none;
      border: 1.5px solid #d0c8bc;
      color: #aaa;
      padding: 9px 28px;
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.2em;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body>
<div id="app"></div>

    ]},

    ]},
  ],
  maint: [
    { id: "weekly_m", label: "毎週", color: "#6a5a8a", items: [
      { id: "m1", text: "焙煎機 クーリングファン清掃" },
      { id: "m2", text: "ばいせん君（C-BOX1TB）フィルター清掃" },
    ]},
    { id: "monthly_m", label: "月1", color: "#5a6a8a", items: [
      { id: "m3", text: "焙煎機 グリスアップ" },
      { id: "m4", text: "エスプレッソ用グラインダー 刃・内部点検" },
      { id: "m5", text: "フィルター用グラインダー 刃・内部点検" },
    ]},
  ],
};

// ── State ──────────────────────────────────────────
let activeTab = "ops";
let done = {};

function getAllItems(tabId) {
  return TAB_DATA[tabId].flatMap(s => s.items);
}

function getDoneCount(tabId) {
  return getAllItems(tabId).filter(i => done[i.id]).length;
}

// ── Render ─────────────────────────────────────────
function render() {
  const sections = TAB_DATA[activeTab];
  const allItems = getAllItems(activeTab);
  const doneCount = allItems.filter(i => done[i.id]).length;
  const total = allItems.length;
  const allDone = doneCount === total && total > 0;

  const dateStr = new Date().toLocaleDateString("ja-JP", {
    month: "long", day: "numeric", weekday: "short"
  });

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="header-sub">HANO COFFEE</div>
      <div class="header-title">作業管理</div>
      <div class="header-date">${dateStr}</div>
    </div>

    <div class="tabs">
      ${TABS.map(t => `
        <button class="tab-btn ${t.id === activeTab ? "active" : ""}" onclick="switchTab('${t.id}')">
          <span class="tab-icon">${t.icon}</span>
          <span class="tab-label">${t.label}</span>
        </button>
      `).join("")}
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>進捗</span>
        <span class="${allDone ? "done" : ""}">${doneCount} / ${total}${allDone ? "　✓ 完了" : ""}</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar ${allDone ? "complete" : ""}" style="width: ${total ? (doneCount / total) * 100 : 0}%"></div>
      </div>
    </div>

    <div class="content">
      ${sections.map(section => `
        <div class="section">
          <div class="section-header">
            <div class="section-bar" style="background: ${section.color}"></div>
            <span class="section-label">${section.label}</span>
            <span class="section-count" style="color: ${section.color}">
              ${section.items.filter(i => done[i.id]).length}/${section.items.length}
            </span>
          </div>
          <div class="items">
            ${section.items.map(item => `
              <button
                class="item-btn ${done[item.id] ? "checked" : ""}"
                style="--accent: ${section.color}"
                onclick="toggleItem('${item.id}')"
              >
                <div class="checkbox">
                  <svg class="check-svg" width="11" height="8" viewBox="0 0 11 8" fill="none">
                    <path d="M1 3.5L4 6.5L10 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
                <span class="item-text">${item.text}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `).join("")}

      <div class="reset-wrap">
        <button class="reset-btn" onclick="resetTab()">リセット</button>
      </div>
    </div>
  `;
}

function switchTab(tabId) {
  activeTab = tabId;
  render();
}

function toggleItem(id) {
  done[id] = !done[id];
  render();
}

function resetTab() {
  getAllItems(activeTab).forEach(i => delete done[i.id]);
  render();
}

render();
</script>
</body>
</html>
